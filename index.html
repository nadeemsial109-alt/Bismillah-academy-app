<script>

const KEY='bea_fazia_data_v1';
const LOGINKEY='bea_fazia_login';

const classes=[
'ECE','Nursery','Prep','1st','2nd','3rd','4th','5th',
'6th','7th','8th','9th','10th','1st Year','2nd Year'
];

let db={
students:[],
fees:[],
tests:[],
attendance:[],
settings:{
academy:'Bismillah Educational Academy Fazia State Jahanian'
}
};

let cloudReady=false;
let loadingCloud=false;

/* =========================
   LOCAL DATA
========================= */

function getLocalData(){
try{
let x=localStorage.getItem(KEY);
if(x){
let d=JSON.parse(x);
if(d && d.students && d.fees && d.tests && d.attendance){
return d;
}
}
}catch(e){
console.error('Local data error:',e);
}
return null;
}

function saveLocal(){
try{
localStorage.setItem(KEY,JSON.stringify(db));
}catch(e){
console.error('Local save error:',e);
}
}

/* =========================
   SUPABASE LOAD
========================= */

async function loadCloudData(){

if(loadingCloud)return;

loadingCloud=true;

try{

const {data,error}=await supabaseClient
.from('Students')
.select('data,created_at')
.order('created_at',{ascending:false})
.limit(1);

if(error){

console.error('Supabase Load Error:',error);

const local=getLocalData();

if(local){
db=local;
}

loadingCloud=false;
return;
}

/* Cloud data exists */

if(data && data.length>0 && data[0].data){

db=data[0].data;

saveLocal();

console.log('Cloud data loaded successfully');

cloudReady=true;

}

/* Cloud empty - migrate existing phone data */

else{

const local=getLocalData();

if(local){

db=local;

console.log('Uploading existing local data to Supabase...');

const {error:insertError}=await supabaseClient
.from('Students')
.insert({
data:local
});

if(insertError){

console.error('Migration Error:',insertError);

}else{

console.log('Existing local data uploaded to Supabase');

cloudReady=true;

}

}else{

cloudReady=true;

}

}

}catch(e){

console.error('Cloud connection error:',e);

const local=getLocalData();

if(local){
db=local;
}

}

loadingCloud=false;

}

/* =========================
   SUPABASE SAVE
========================= */

async function save(){
  saveLocal();

  try{
    const {error}=await supabaseClient
      .from('Students')
      .insert({
        data: db
      });

    if(error){
      console.error('Supabase save error:',error);
      toast('Cloud save failed');
      return;
    }

    cloudReady=true;
    console.log('Data saved to Supabase');
  }catch(e){
    console.error('Supabase connection error:',e);
    toast('Cloud save error');
  }
}
/* =========================
   TOAST
========================= */

function toast(t){

let x=document.getElementById('toast');

x.textContent=t;

x.classList.remove('hidden');

setTimeout(()=>{
x.classList.add('hidden');
},2200);

}

/* =========================
   ESCAPE HTML
========================= */

function esc(s){

return String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

}

function addStudent(){

let s={
id:Date.now(),
name:sname.value.trim(),
father:sfather.value.trim(),
roll:sroll.value.trim(),
class:sclass.value,
mobile:smobile.value.trim(),
date:sdate.value,
fee:Number(sfee.value||0)
};

if(!s.name)
return toast('Student name required');

db.students.push(s);

save();

[
'sname',
'sfather',
'sroll',
'smobile',
'sdate',
'sfee'
].forEach(id=>{
document.getElementById(id).value='';
});

renderStudents();

toast('Student saved');

}

.join(' ')

);

<td>${esc(s.father)}</td>

<td>${s.class}</td>

<td>

class="btn red"
onclick="del('students',${s.id},renderStudents)">

function addAttendance(){

let s=db.students.find(x=>x.id==astudent.value);

if(!s)
return toast('Add students first');

db.attendance.push({
id:Date.now(),
studentId:s.id,
name:s.name,
class:s.class,
date:adate.value,
status:astatus.value
});

save();

renderAttendance();

toast('Attendance saved');

}

function renderAttendance(){

let cl=
document.getElementById('attClass')?.value||'';

let mo=
document.getElementById('attMonth')?.value||'';

let a=db.attendance.filter(x=>
(!cl||x.class===cl)&&
(!mo||x.date.startsWith(mo))
);

document.getElementById('attTable').innerHTML=`

<table>

<tr>
<th>Student</th>
<th>Class</th>
<th>Date</th>
<th>Status</th>
<th></th>
</tr>

${a.map(x=>`

<tr>

<td>${esc(x.name)}</td>
<td>${x.class}</td>
<td>${x.date}</td>
<td>${x.status}</td>

<td>

<button
class="btn red"
onclick="del('attendance',${x.id},renderAttendance)">
Delete
</button>

</td>

</tr>

`).join('')}

</table>

`;

}

function backupPage(){

document.getElementById('content').innerHTML=`

<div class="panel">

<h2>💾 Backup & Restore</h2>

<p class="muted">
Your data is saved locally and synchronized with Supabase cloud.
Keep a backup regularly as an extra safety copy.
</p>

<div class="actions">

<button class="btn" onclick="downloadBackup()">
Download Backup
</button>

<label class="btn green">

Restore Backup

<input
type="file"
accept=".json"
onchange="restoreBackup(event)"
hidden>

</label>

</div>

</div>

<div class="panel">

<h3>Data Summary</h3>

<p>
Students: ${db.students.length}
|
Fees: ${db.fees.length}
|
Tests: ${db.tests.length}
|
Attendance: ${db.attendance.length}
</p>

</div>

`;

}

function downloadBackup(){

let blob=new Blob(
[JSON.stringify(db,null,2)],
{type:'application/json'}
);

let a=document.createElement('a');

a.href=URL.createObjectURL(blob);

a.download=
'Bismillah_Academy_Backup_'+
new Date().toISOString().slice(0,10)+
'.json';

a.click();

toast('Backup downloaded');

}

function restoreBackup(e){

let f=e.target.files[0];

if(!f)return;

let r=new FileReader();

r.onload=()=>{

try{

let x=JSON.parse(r.result);

if(
!x.students||
!x.fees||
!x.tests||
!x.attendance
)throw Error();

db=x;

save();

toast('Backup restored');

showPage('dashboard');

}catch(_){

toast('Invalid backup file');

}

};

r.readAsText(f);

}

/* =========================
   DELETE
========================= */

function del(type,id,cb){

if(confirm('Delete this record?')){

db[type]=db[type].filter(x=>x.id!==id);

save();

cb();

toast('Deleted');

}

}

function printArea(title,html){

let w=window.open('','_blank');

w.document.write(`

<html>

<head>

<title>${title}</title>

<style>

body{
font-family:Arial;
padding:20px
}

table{
width:100%;
border-collapse:collapse
}

th,td{
border:1px solid #aaa;
padding:7px;
text-align:left
}

h1,h2{
text-align:center
}

</style>

</head>

<body>

<h1>${esc(db.settings.academy)}</h1>

<h2>${title}</h2>

${html}

</body>

</html>

`);

w.document.close();

w.focus();

setTimeout(()=>{
w.print();
},300);

}
