<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bismillah Educational Academy</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f8;
    color:#222;
}

.header{
    background:#00695c;
    color:white;
    text-align:center;
    padding:20px 10px;
}

.header h1{margin:0;font-size:22px}
.header p{margin:6px 0 0}

.nav{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:15px;
}

.nav button{
    padding:15px 5px;
    border:0;
    border-radius:10px;
    background:white;
    box-shadow:0 2px 7px #ccc;
    font-size:15px;
}

.container{padding:15px}

.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 7px #ddd;
}

h2{margin-top:0}

input,select{
    width:100%;
    padding:12px;
    margin:6px 0 10px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.btn{
    width:100%;
    padding:12px;
    border:0;
    border-radius:7px;
    background:#00695c;
    color:white;
    font-size:15px;
    margin-top:5px;
}

.danger{background:#c62828}
.secondary{background:#555}

.page{display:none}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:white;
    padding:15px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 7px #ddd;
}

.stat b{
    display:block;
    font-size:25px;
    color:#00695c;
}

.student{
    border:1px solid #ddd;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
}

.smallbtn{
    padding:7px 10px;
    border:0;
    border-radius:5px;
    color:white;
    margin:5px 3px 0 0;
    background:#00695c;
}

.red{background:#c62828}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:5px;
    background:#eee;
}

.paid{background:#c8e6c9}
.unpaid{background:#ffcdd2}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

td,th{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
    font-size:13px;
}

.back{
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Bismillah Educational Academy</h1>
    <p>Jahanian</p>
</div>

<!-- HOME -->
<div id="home">

    <div class="nav">
        <button onclick="showPage('dashboard')">📊<br>Dashboard</button>
        <button onclick="showPage('students')">👨‍🎓<br>Students</button>
        <button onclick="showPage('fees')">💰<br>Fees</button>
        <button onclick="showPage('attendance')">📋<br>Attendance</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>🏫 School Management</h2>
            <p>Students, fees aur attendance manage karein.</p>
        </div>
    </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="page container">

    <button class="btn secondary back" onclick="showPage('home')">← Home</button>

    <h2>📊 Dashboard</h2>

    <div class="stats">

        <div class="stat">
            <b id="totalStudents">0</b>
            Students
        </div>

        <div class="stat">
            <b id="totalPaid">0</b>
            Paid Fees
        </div>

        <div class="stat">
            <b id="totalUnpaid">0</b>
            Unpaid
        </div>

        <div class="stat">
            <b id="totalPresent">0</b>
            Present
        </div>

    </div>
</div>


<!-- STUDENTS -->
<div id="students" class="page container">

<button class="btn secondary back" onclick="showPage('home')">← Home</button>

<div class="card">

<h2>👨‍🎓 Add Student</h2>

<input id="studentName" placeholder="Student Name">

<input id="fatherName" placeholder="Father Name">

<select id="studentClass">
<option value="">Select Class</option>
<option>ECE</option>
<option>Nursery</option>
<option>Prep</option>
<option>1st</option>
<option>2nd</option>
<option>3rd</option>
<option>4th</option>
<option>5th</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option>9th</option>
<option>10th</option>
<option>1st Year</option>
<option>2nd Year</option>
</select>

<input id="studentFee" type="number" placeholder="Monthly Fee">

<button class="btn" onclick="saveStudent()">💾 Save Student</button>

</div>

<div class="card">

<h2>🔎 Search Students</h2>

<input id="searchStudent"
placeholder="Search by name or father name"
oninput="displayStudents()">

<div id="studentList"></div>

</div>

</div>


<!-- FEES -->
<div id="fees" class="page container">

<button class="btn secondary back" onclick="showPage('home')">← Home</button>

<div class="card">

<h2>💰 Fees Management</h2>

<select id="feeStudent"></select>

<input id="feeAmount" type="number" placeholder="Fee Amount">

<select id="feeStatus">
<option value="Paid">Paid</option>
<option value="Unpaid">Unpaid</option>
</select>

<button class="btn" onclick="saveFee()">💾 Save Fee</button>

</div>

<div class="card">

<h2>Fee Records</h2>

<div id="feeList"></div>

</div>

</div>


<!-- ATTENDANCE -->
<div id="attendance" class="page container">

<button class="btn secondary back" onclick="showPage('home')">← Home</button>

<div class="card">

<h2>📋 Attendance</h2>

<select id="attendanceStudent"></select>

<select id="attendanceStatus">
<option value="Present">Present</option>
<option value="Absent">Absent</option>
</select>

<button class="btn" onclick="saveAttendance()">Save Attendance</button>

</div>

<div class="card">

<h2>Attendance Records</h2>

<div id="attendanceList"></div>

</div>

</div>


<script>

/* DATA */

let students = JSON.parse(localStorage.getItem("students")) || [];
let fees = JSON.parse(localStorage.getItem("fees")) || [];
let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

let editIndex = -1;


/* PAGE */

function showPage(page){

    document.querySelectorAll(".page").forEach(function(x){
        x.style.display="none";
    });

    document.getElementById("home").style.display="none";

    if(page==="home"){
        document.getElementById("home").style.display="block";
    }else{
        document.getElementById(page).style.display="block";
    }

    updateAll();
}


/* STUDENTS */

function saveStudent(){

    let name=document.getElementById("studentName").value.trim();
    let father=document.getElementById("fatherName").value.trim();
    let studentClass=document.getElementById("studentClass").value;
    let fee=document.getElementById("studentFee").value;

    if(!name || !father || !studentClass){
        alert("Student ki complete information enter karein.");
        return;
    }

    let data={
        name:name,
        father:father,
        className:studentClass,
        fee:fee || 0
    };

    if(editIndex===-1){
        students.push(data);
        alert("Student successfully added!");
    }else{
        students[editIndex]=data;
        editIndex=-1;
        alert("Student updated!");
    }

    localStorage.setItem("students",JSON.stringify(students));

    clearStudentForm();
    displayStudents();
    updateAll();
}


function displayStudents(){

    let list=document.getElementById("studentList");
    let search=document.getElementById("searchStudent").value.toLowerCase();

    list.innerHTML="";

    students.forEach(function(s,index){

        if(
            s.name.toLowerCase().includes(search) ||
            s.father.toLowerCase().includes(search)
        ){

            list.innerHTML+=`
            <div class="student">

            <b>👨‍🎓 ${s.name}</b><br>
            Father: ${s.father}<br>
            Class: ${s.className}<br>
            Monthly Fee: Rs. ${s.fee}

            <br>

            <button class="smallbtn"
            onclick="editStudent(${index})">
            Edit
            </button>

            <button class="smallbtn red"
            onclick="deleteStudent(${index})">
            Delete
            </button>

            </div>
            `;
        }

    });
}


function editStudent(index){

    let s=students[index];

    document.getElementById("studentName").value=s.name;
    document.getElementById("fatherName").value=s.father;
    document.getElementById("studentClass").value=s.className;
    document.getElementById("studentFee").value=s.fee;

    editIndex=index;

    window.scrollTo(0,0);
}


function deleteStudent(index){

    if(confirm("Kya aap is student ko delete karna chahte hain?")){

        students.splice(index,1);

        localStorage.setItem("students",JSON.stringify(students));

        displayStudents();
        updateAll();
    }
}


function clearStudentForm(){

    document.getElementById("studentName").value="";
    document.getElementById("fatherName").value="";
    document.getElementById("studentClass").value="";
    document.getElementById("studentFee").value="";
}


/* FEES */

function updateStudentSelects(){

    let feeSelect=document.getElementById("feeStudent");
    let attendanceSelect=document.getElementById("attendanceStudent");

    feeSelect.innerHTML='<option value="">Select Student</option>';
    attendanceSelect.innerHTML='<option value="">Select Student</option>';

    students.forEach(function(s,index){

        let option=
        `<option value="${index}">
        ${s.name} - ${s.className}
        </option>`;

        feeSelect.innerHTML+=option;
        attendanceSelect.innerHTML+=option;
    });
}


function saveFee(){

    let studentIndex=document.getElementById("feeStudent").value;
    let amount=document.getElementById("feeAmount").value;
    let status=document.getElementById("feeStatus").value;

    if(studentIndex===""){
        alert("Student select karein.");
        return;
    }

    let s=students[studentIndex];

    fees.push({
        student:s.name,
        amount:amount,
        status:status,
        date:new Date().toLocaleDateString()
    });

    localStorage.setItem("fees",JSON.stringify(fees));

    document.getElementById("feeAmount").value="";

    displayFees();
    updateDashboard();

    alert("Fee record saved!");
}


function displayFees(){

    let list=document.getElementById("feeList");

    list.innerHTML="";

    fees.forEach(function(f,index){

        let cls=f.status==="Paid" ? "paid" : "unpaid";

        list.innerHTML+=`
        <div class="student">

        <b>${f.student}</b><br>

        Amount: Rs. ${f.amount}<br>

        Date: ${f.date}<br>

        <span class="badge ${cls}">
        ${f.status}
        </span>

        <br>

        <button class="smallbtn red"
        onclick="deleteFee(${index})">
        Delete
        </button>

        </div>
        `;

    });
}


function deleteFee(index){

    if(confirm("Fee record delete karein?")){

        fees.splice(index,1);

        localStorage.setItem("fees",JSON.stringify(fees));

        displayFees();
        updateDashboard();
    }
}


/* ATTENDANCE */

function saveAttendance(){

    let studentIndex=document.getElementById("attendanceStudent").value;
    let status=document.getElementById("attendanceStatus").value;

    if(studentIndex===""){
        alert("Student select karein.");
        return;
    }

    let s=students[studentIndex];

    attendance.push({
        student:s.name,
        status:status,
        date:new Date().toLocaleDateString()
    });

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    displayAttendance();
    updateDashboard();

    alert("Attendance saved!");
}


function displayAttendance(){

    let list=document.getElementById("attendanceList");

    list.innerHTML="";

    attendance.forEach(function(a,index){

        list.innerHTML+=`
        <div class="student">

        <b>${a.student}</b><br>
        Date: ${a.date}<br>
        Status: ${a.status}

        <br>

        <button class="smallbtn red"
        onclick="deleteAttendance(${index})">
        Delete
        </button>

        </div>
        `;

    });
}


function deleteAttendance(index){

    if(confirm("Attendance delete karein?")){

        attendance.splice(index,1);

        localStorage.setItem(
            "attendance",
            JSON.stringify(attendance)
        );

        displayAttendance();
        updateDashboard();
    }
}


/* DASHBOARD */

function updateDashboard(){

    document.getElementById("totalStudents").innerText=
    students.length;

    document.getElementById("totalPaid").innerText=
    fees.filter(f=>f.status==="Paid").length;

    document.getElementById("totalUnpaid").innerText=
    fees.filter(f=>f.status==="Unpaid").length;

    document.getElementById("totalPresent").innerText=
    attendance.filter(a=>a.status==="Present").length;
}


function updateAll(){

    displayStudents();
    displayFees();
    displayAttendance();
    updateStudentSelects();
    updateDashboard();
}


/* START */

updateAll();

</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
